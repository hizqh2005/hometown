<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ededed">
  <link rel="icon" href="data:,">
  <title>朋友圈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="cover">
      <div class="cover-title">家乡记事</div>
      <a class="manage-btn" href="editor.html" aria-label="管理">✎</a>
      <div class="profile">
        <div class="avatar">🌄</div>
        <div class="pname">我</div>
      </div>
    </header>

    <main class="feed" id="feed"></main>

    <nav class="rail" id="rail" hidden aria-label="按年份跳转"></nav>
    <div class="rail-indicator" id="railIndicator"></div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="关闭">×</button>
    <div class="lb-count" id="lbCount"></div>
    <img class="lb-img" id="lbImg" alt="">
  </div>

  <script type="module" src="browse.js"></script>
</body>
</html>
